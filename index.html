
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitClub | November</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    font-family: 'Montserrat', sans-serif;
}

.november-banner {
    position: relative;
    width: 100%;
    height: 350px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    isolation: isolate;
    color: #fff;
    padding: 12px;

    background:
        radial-gradient(
            ellipse at 12% 12%,
            rgba(251,146,60,.30),
            transparent 40%
        ),
        radial-gradient(
            ellipse at 90% 85%,
            rgba(190,65,35,.30),
            transparent 45%
        ),
        radial-gradient(
            ellipse at 55% 100%,
            rgba(245,158,11,.12),
            transparent 50%
        ),
        linear-gradient(
            125deg,
            #241629 0%,
            #432135 42%,
            #713c2b 75%,
            #38202c 100%
        );
}

/* Warm atmospheric lighting */

.november-banner::before {
    content: "";
    position: absolute;
    inset: -30%;
    z-index: 0;
    pointer-events: none;

    background:
        radial-gradient(
            ellipse at 30% 30%,
            rgba(251,191,36,.12),
            transparent 45%
        ),
        radial-gradient(
            ellipse at 75% 70%,
            rgba(249,115,22,.14),
            transparent 45%
        );

    animation: atmosphere 18s ease-in-out infinite alternate;
}

@keyframes atmosphere {
    from {
        transform: translate(-3%, 2%) scale(1);
    }
    to {
        transform: translate(3%, -2%) scale(1.08);
    }
}

/* Decorative autumn circles */

.glow {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
}

.glow-one {
    width: 240px;
    height: 240px;
    top: -140px;
    right: 7%;
    background: rgba(251,191,36,.16);
    filter: blur(35px);
}

.glow-two {
    width: 280px;
    height: 280px;
    bottom: -190px;
    left: 4%;
    background: rgba(249,115,22,.18);
    filter: blur(45px);
}

/* Falling autumn leaves */

.leaves {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
}

.leaf {
    position: absolute;
    top: -45px;
    opacity: .30;
    font-size: 22px;
    line-height: 1;
    will-change: transform;
    animation: leafFall linear infinite;
}

@keyframes leafFall {
    0% {
        transform:
            translate3d(0, -20px, 0)
            rotate(0deg);
    }
    50% {
        transform:
            translate3d(35px, 190px, 0)
            rotate(160deg);
    }
    100% {
        transform:
            translate3d(-20px, 430px, 0)
            rotate(360deg);
    }
}

/* Main content */

.content {
    position: relative;
    z-index: 3;
    width: min(96%, 950px);
    display: flex;
    flex-direction: column;
    align-items: center;
}

.kicker {
    display: inline-block;
    margin-bottom: 12px;
    padding: 7px 17px;
    border-radius: 100px;

    background: rgba(255,255,255,.09);
    border: 1px solid rgba(253,186,116,.32);

    color: #fed7aa;
    font-size: clamp(.62rem,1.7vw,.8rem);
    font-weight: 800;
    letter-spacing: .22em;
    text-transform: uppercase;
}

.headline {
    font-size: clamp(1.9rem,5.5vw,3.6rem);
    font-weight: 900;
    letter-spacing: -.04em;
    line-height: 1.06;
    margin-bottom: 17px;

    text-shadow: 0 6px 25px rgba(0,0,0,.45);
}

.headline .accent {
    display: block;

    background: linear-gradient(
        90deg,
        #fde68a 0%,
        #fbbf24 45%,
        #fb923c 100%
    );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    filter: drop-shadow(
        0 3px 12px rgba(251,146,60,.18)
    );
}

/* Glass messaging card */

.card {
    display: inline-block;
    max-width: 100%;
    padding: 15px 30px;
    border-radius: 17px;

    background: rgba(19,12,25,.56);
    border: 1px solid rgba(253,186,116,.24);

    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    box-shadow:
        0 12px 35px rgba(0,0,0,.30),
        0 0 30px rgba(251,146,60,.05);
}

.main-line {
    font-size: clamp(1rem,2.6vw,1.3rem);
    font-weight: 800;
    line-height: 1.35;
    color: #fff;
}

.main-line strong {
    color: #fbbf24;
}

.sub-line {
    margin-top: 7px;
    font-size: clamp(.78rem,1.9vw,.98rem);
    font-weight: 500;
    line-height: 1.4;
    color: #f3d8cc;
}

/* Bottom decorative line */

.bottom-accent {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 3px;
    z-index: 4;

    background: linear-gradient(
        90deg,
        transparent,
        #fbbf24,
        #fb923c,
        #fbbf24,
        transparent
    );

    box-shadow: 0 0 18px rgba(251,146,60,.35);
}

/* Mobile adjustments */

@media (max-width: 600px) {
    .headline {
        font-size: clamp(1.75rem,7.3vw,2.5rem);
        margin-bottom: 13px;
    }

    .kicker {
        letter-spacing: .13em;
        margin-bottom: 10px;
    }

    .card {
        padding: 13px 16px;
    }

    .main-line {
        font-size: clamp(.94rem,3.8vw,1.1rem);
    }

    .sub-line {
        font-size: clamp(.74rem,3vw,.9rem);
    }

    .leaf {
        opacity: .20;
    }
}

@media (prefers-reduced-motion: reduce) {
    .november-banner::before,
    .leaf {
        animation: none;
    }
}
</style>
</head>

<body>

<div class="november-banner">

    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>

    <div class="leaves" id="leaves" aria-hidden="true"></div>

    <div class="content">

        <div class="kicker">
            Your Head Start Starts Here
        </div>

        <h1 class="headline">
            DON'T WAIT FOR
            <span class="accent">JANUARY.</span>
        </h1>

        <div class="card">

            <div class="main-line">
                Start Strong Now.
                <strong>Finish the Year Stronger.</strong>
            </div>

            <div class="sub-line">
                Build the habit today. Thank yourself tomorrow.
            </div>

        </div>

    </div>

    <div class="bottom-accent"></div>

</div>

<script>
(function() {

    const container = document.getElementById('leaves');

    if (!container) return;

    const icons = ['🍂', '🍁', '🍃'];

    const reduceMotion = window.matchMedia(
        '(prefers-reduced-motion: reduce)'
    ).matches;

    const count = reduceMotion ? 12 : 32;

    for (let i = 0; i < count; i++) {

        const leaf = document.createElement('span');

        leaf.className = 'leaf';

        leaf.textContent =
            icons[Math.floor(Math.random() * icons.length)];

        leaf.style.left = Math.random() * 100 + '%';

        leaf.style.fontSize =
            (14 + Math.random() * 14) + 'px';

        leaf.style.animationDuration =
            (9 + Math.random() * 12) + 's';

        leaf.style.animationDelay =
            (-Math.random() * 20) + 's';

        if (reduceMotion) {
            leaf.style.top = Math.random() * 90 + '%';
        }

        container.appendChild(leaf);
    }

})();
</script>

</body>
</html>
