<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FitClub • Labor Day Flash Sale</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet" />

  <style>
    *{margin:0;padding:0;box-sizing:border-box}

    html,body{
      width:100%;
      height:100%;
      font-family:'Montserrat',sans-serif;
    }

    .banner{
      position:relative;
      width:100%;
      height:350px;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:#fff;
      padding:12px;
    }

    /* Labor Day / late-summer patriotic background */
    .bg{
      position:absolute;
      inset:0;
      z-index:0;
      background:
        radial-gradient(circle at 15% 15%, rgba(239,68,68,.38), transparent 32%),
        radial-gradient(circle at 85% 85%, rgba(37,99,235,.42), transparent 34%),
        radial-gradient(circle at 50% 0%, rgba(250,204,21,.16), transparent 30%),
        linear-gradient(135deg,#0b1f3a 0%,#172554 50%,#111827 100%);
      background-size:120% 120%,120% 120%,120% 120%,100% 100%;
      animation:bgshift 20s ease-in-out infinite alternate;
    }

    @keyframes bgshift{
      from{background-position:0 0,100% 100%,50% 0,0 0}
      to{background-position:15% 15%,85% 85%,55% 10%,100% 100%}
    }

    /* Subtle celebratory pieces */
    .confetti{
      position:absolute;
      inset:0;
      z-index:1;
      pointer-events:none;
      overflow:hidden;
    }

    .piece{
      position:absolute;
      top:-10%;
      width:8px;
      height:4px;
      border-radius:2px;
      opacity:.4;
      animation:fall linear infinite;
    }

    @keyframes fall{
      from{transform:translateY(0) rotate(0deg)}
      to{transform:translateY(115vh) rotate(720deg)}
    }

    .content{
      position:relative;
      z-index:2;
      width:min(95%,900px);
    }

    .kicker{
      display:inline-block;
      margin-bottom:8px;
      padding:6px 13px;
      border-radius:999px;
      background:#ef4444;
      color:#fff;
      font-size:clamp(.65rem,1.8vw,.8rem);
      font-weight:800;
      letter-spacing:.18em;
      text-transform:uppercase;
      box-shadow:0 8px 20px rgba(0,0,0,.28);
    }

    h1{
      font-size:clamp(1.6rem,4.5vw,2.7rem);
      line-height:1.05;
      margin-bottom:14px;
      text-shadow:0 6px 20px rgba(0,0,0,.6);
    }

    .accent{
      color:#fde68a;
    }

    .card{
      display:inline-block;
      max-width:95%;
      padding:14px 26px;
      border-radius:16px;
      background:rgba(0,0,0,.42);
      backdrop-filter:blur(5px);
      border:1px solid rgba(255,255,255,.20);
      box-shadow:0 14px 34px rgba(0,0,0,.38);
    }

    .price{
      font-size:clamp(2rem,5vw,3rem);
      line-height:1;
      color:#fde68a;
      font-weight:900;
      margin-bottom:8px;
    }

    .line{
      font-size:clamp(.9rem,2.2vw,1.1rem);
      line-height:1.35;
      margin:5px 0;
      text-shadow:0 2px 10px rgba(0,0,0,.55);
    }

    .urgency{
      display:inline-block;
      margin-top:9px;
      padding:5px 12px;
      border-radius:999px;
      background:#2563eb;
      border:1px solid rgba(255,255,255,.2);
      font-size:clamp(.7rem,1.7vw,.85rem);
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    @media (prefers-reduced-motion:reduce){
      .bg{animation:none}
      .piece{animation:none}
    }
  </style>
</head>

<body>

  <div class="banner">

    <div class="bg"></div>

    <div class="confetti" id="confetti" aria-hidden="true"></div>

    <div class="content">

      <div class="kicker">
        Labor Day Flash Sale • One Day Only
      </div>

      <h1>
        Take a Break From Full Price.
        <span class="accent">Get Moving for Less.</span>
      </h1>

      <div class="card">

        <div class="price">
          $5 for Your First 50 Days
        </div>

        <div class="line">
          🔥 Fifty days to build momentum for just five bucks.
        </div>

        <div class="line">
          💪 Start now. Let the habit do the heavy lifting.
        </div>

        <div class="urgency">
          Ends Tonight
        </div>

      </div>

    </div>

  </div>

  <script>
    const container = document.getElementById('confetti');
    const colors = ['#ef4444','#ffffff','#2563eb','#fde68a'];

    for(let i=0;i<55;i++){
      const el = document.createElement('span');

      el.className = 'piece';
      el.style.left = Math.random()*100 + '%';
      el.style.background = colors[Math.floor(Math.random()*colors.length)];
      el.style.animationDuration = (8 + Math.random()*9) + 's';
      el.style.animationDelay = (Math.random()*9) + 's';

      container.appendChild(el);
    }
  </script>

</body>
</html>
