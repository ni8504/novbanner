<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FitClub • Back to School Special</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet" />

  <style>
    *{margin:0;padding:0;box-sizing:border-box}

    html,body{
      width:100%;
      height:100%;
      font-family:'Montserrat',sans-serif;
    }

    .banner{
      position:relative;
      width:100%;
      height:350px;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:#fff;
      padding:12px;
    }

    /* Chalkboard-style background */
    .bg{
      position:absolute;
      inset:0;
      z-index:0;
      background:
        radial-gradient(circle at 15% 20%, rgba(250,204,21,.16), transparent 28%),
        radial-gradient(circle at 85% 85%, rgba(56,189,248,.15), transparent 30%),
        linear-gradient(135deg,#17392f 0%,#102b24 50%,#0b211b 100%);
    }

    /* faint chalk speckle */
    .bg::after{
      content:"";
      position:absolute;
      inset:0;
      opacity:.08;
      background-image:
        radial-gradient(#fff 1px, transparent 1px),
        radial-gradient(#fff 1px, transparent 1px);
      background-size:18px 18px,26px 26px;
      background-position:0 0,9px 11px;
    }

    /* Floating school doodles */
    .doodles{
      position:absolute;
      inset:0;
      z-index:1;
      pointer-events:none;
      overflow:hidden;
    }

    .doodle{
      position:absolute;
      top:-12%;
      opacity:.16;
      font-size:20px;
      animation:fall linear infinite;
    }

    @keyframes fall{
      from{transform:translateY(0) rotate(0deg)}
      to{transform:translateY(115vh) rotate(360deg)}
    }

    .content{
      position:relative;
      z-index:2;
      width:min(95%,900px);
    }

    .kicker{
      display:inline-block;
      margin-bottom:8px;
      padding:6px 12px;
      border-radius:999px;
      background:#facc15;
      color:#172554;
      font-size:clamp(.65rem,1.8vw,.8rem);
      font-weight:800;
      letter-spacing:.16em;
      text-transform:uppercase;
      box-shadow:0 8px 20px rgba(0,0,0,.25);
    }

    h1{
      font-size:clamp(1.6rem,4.7vw,2.65rem);
      line-height:1.05;
      margin-bottom:14px;
      text-shadow:0 5px 18px rgba(0,0,0,.55);
    }

    .accent{
      color:#fde68a;
    }

    .card{
      display:inline-block;
      max-width:95%;
      padding:14px 24px;
      border-radius:16px;
      background:rgba(0,0,0,.40);
      backdrop-filter:blur(5px);
      border:1px solid rgba(255,255,255,.18);
      box-shadow:0 12px 30px rgba(0,0,0,.35);
    }

    .price{
      font-size:clamp(1.9rem,5vw,2.9rem);
      line-height:1;
      color:#fde68a;
      font-weight:900;
      margin-bottom:8px;
    }

    .line{
      font-size:clamp(.9rem,2.2vw,1.1rem);
      line-height:1.35;
      margin:5px 0;
      text-shadow:0 2px 10px rgba(0,0,0,.5);
    }

    .small-line{
      margin-top:8px;
      font-size:clamp(.75rem,1.8vw,.9rem);
      color:#d1fae5;
    }

    @media (prefers-reduced-motion:reduce){
      .doodle{animation:none}
    }
  </style>
</head>

<body>

  <div class="banner">

    <div class="bg"></div>

    <div class="doodles" id="doodles" aria-hidden="true"></div>

    <div class="content">

      <div class="kicker">
        Back to School Special
      </div>

      <h1>
        Class Is Back. <span class="accent">So Is Your Routine.</span>
      </h1>

      <div class="card">

        <div class="price">
          $19.99 to Join
        </div>

        <div class="line">
          📚 No monthly dues until <strong>August 31st</strong>
        </div>

        <div class="line">
          ✏️ New schedule. Fresh routine. Stronger you.
        </div>

        <div class="small-line">
          Sauna = extra credit.
        </div>

      </div>

    </div>

  </div>

  <script>
    const doodles = document.getElementById('doodles');

    const icons = ['✏️','📚','🎒','📓','📏','🧮'];

    for(let i=0;i<45;i++){
      const el = document.createElement('span');
      el.className = 'doodle';
      el.textContent = icons[Math.floor(Math.random()*icons.length)];
      el.style.left = Math.random()*100 + '%';
      el.style.animationDuration = (8 + Math.random()*9) + 's';
      el.style.animationDelay = (Math.random()*10) + 's';
      doodles.appendChild(el);
    }
  </script>

</body>
</html>
