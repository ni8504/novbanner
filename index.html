<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FitClub • Fall</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Montserrat', sans-serif;
    }

    .banner {
      position: relative;
      width: 100%;
      height: 350px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      padding: clamp(10px, 2vw, 18px);
    }

    /* Rich fall background */
    .bg {
      position: absolute;
      inset: 0;
      z-index: 0;

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(251, 191, 36, .30),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 20%,
          rgba(234, 88, 12, .30),
          transparent 32%
        ),
        radial-gradient(
          circle at 75% 90%,
          rgba(180, 83, 9, .30),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #3f3a22 0%,
          #365314 35%,
          #713f12 70%,
          #431407 100%
        );

      background-size:
        120% 120%,
        120% 120%,
        120% 120%,
        100% 100%;

      animation: bgshift 24s ease-in-out infinite alternate;
    }

    @keyframes bgshift {
      from {
        background-position:
          0 0,
          100% 0,
          100% 100%,
          0 0;
      }

      to {
        background-position:
          15% 15%,
          85% 15%,
          85% 85%,
          100% 100%;
      }
    }

    /* Soft warm glow */
    .glow {
      position: absolute;
      width: 400px;
      height: 400px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(251, 191, 36, .10);
      filter: blur(70px);
      z-index: 1;
    }

    /* Falling leaves */
    .leaves {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .leaf {
      position: absolute;
      top: -15%;
      opacity: .20;
      font-size: clamp(16px, 2.3vw, 25px);
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) translateX(0) rotate(0deg);
      }

      50% {
        transform: translateY(55vh) translateX(25px) rotate(180deg);
      }

      100% {
        transform: translateY(115vh) translateX(-15px) rotate(360deg);
      }
    }

    .content {
      position: relative;
      z-index: 3;
      width: min(95%, 950px);
    }

    .kicker {
      display: inline-block;
      margin-bottom: 10px;
      padding: 6px 15px;
      border-radius: 999px;

      background: rgba(0, 0, 0, .28);
      border: 1px solid rgba(255, 255, 255, .20);

      font-size: clamp(.65rem, 1.8vw, .8rem);
      font-weight: 800;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: #fef3c7;

      box-shadow: 0 8px 20px rgba(0, 0, 0, .20);
    }

    h1 {
      font-size: clamp(2rem, 5.5vw, 3.25rem);
      font-weight: 900;
      line-height: 1.02;
      margin-bottom: 15px;
      text-shadow: 0 6px 22px rgba(0, 0, 0, .60);
    }

    .accent {
      background: linear-gradient(
        90deg,
        #fde68a,
        #fbbf24,
        #fb923c
      );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .card {
      display: inline-block;
      max-width: 95%;
      padding: 15px 28px;
      border-radius: 16px;

      background: rgba(0, 0, 0, .38);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);

      border: 1px solid rgba(255, 255, 255, .17);

      box-shadow:
        0 12px 32px rgba(0, 0, 0, .35);
    }

    .main-line {
      font-size: clamp(1rem, 2.6vw, 1.3rem);
      line-height: 1.35;
      margin-bottom: 6px;
    }

    .sub-line {
      font-size: clamp(.78rem, 2vw, .95rem);
      line-height: 1.4;
      color: #fef3c7;
    }

    @media (max-width: 480px) {
      .card {
        padding: 13px 18px;
      }

      .kicker {
        letter-spacing: .16em;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .bg {
        animation: none;
      }

      .leaf {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <div class="banner">

    <div class="bg"></div>
    <div class="glow"></div>

    <div
      class="leaves"
      id="leaves"
      aria-hidden="true">
    </div>

    <div class="content">

      <div class="kicker">
        A Stronger Season Starts Now
      </div>

      <h1>
        Fall Into a
        <span class="accent">Stronger Routine.</span>
      </h1>

      <div class="card">

        <div class="main-line">
          The seasons change.
          <strong>Your goals don't have to.</strong>
        </div>

        <div class="sub-line">
          🍂 Keep moving. Keep building. Keep getting stronger.
        </div>

      </div>

    </div>

  </div>

  <script>
    const container = document.getElementById('leaves');

    const icons = [
      '🍂',
      '🍁',
      '🍃'
    ];

    for (let i = 0; i < 42; i++) {

      const leaf = document.createElement('span');

      leaf.className = 'leaf';

      leaf.textContent =
        icons[Math.floor(Math.random() * icons.length)];

      leaf.style.left =
        Math.random() * 100 + '%';

      leaf.style.animationDuration =
        (9 + Math.random() * 11) + 's';

      leaf.style.animationDelay =
        (Math.random() * 10) + 's';

      leaf.style.fontSize =
        (14 + Math.random() * 13) + 'px';

      container.appendChild(leaf);
    }
  </script>

</body>
</html>
